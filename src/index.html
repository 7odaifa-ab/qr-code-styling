<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Code Styling Playground</title>
</head>
<body>
  <div id="canvas"></div>
  <script type="application/javascript" charset="utf-8">
    const options = {
      width: 300,
      height: 300,
      data: "https://zakhm.sa",
      image: "https://upload.wikimedia.org/wikipedia/commons/5/51/Pokebola-pokeball-png-0.png",
      dotsOptions: {
        color: "#4267b2",
        type: "rounded"
      },
      backgroundOptions: {
        color: "#e9ebee",
      },
      imageOptions: {
        crossOrigin: "anonymous",
        margin: 20
      }
    };

    const qrCode = new QRCodeStyling(options);
    qrCode.append(document.getElementById("canvas"));
  </script>
</body>
</html>
